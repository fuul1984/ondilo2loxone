[AUTOUPDATE]
# Diese Datei wird von LoxBerry ueber die in plugin.cfg hinterlegte
# RELEASECFG-URL periodisch abgerufen und mit der installierten VERSION
# verglichen. Ist die hier angegebene Version neuer, wird ARCHIVEURL
# heruntergeladen und automatisch installiert.
#
# Bei jedem neuen Release: VERSION, ARCHIVEURL und INFOURL zusammen mit
# einem passenden Git-Tag aktualisieren und pushen.

# Version des neuen Releases (muss zu VERSION in plugin.cfg [PLUGIN] passen).
VERSION=0.1.2

# Download-URL des ZIP-Archivs fuer dieses Release (GitHub-Tag-Archiv).
ARCHIVEURL=https://github.com/fuul1984/ondilo2loxone/archive/refs/tags/v0.1.2.zip

# URL mit weiteren Informationen zu diesem Release (wird dem Nutzer angezeigt).
INFOURL=https://github.com/fuul1984/ondilo2loxone/releases/tag/v0.1.2
