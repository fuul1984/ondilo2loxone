[AUTHOR]
# Autor/Team-Name und E-Mail. NIEMALS nachtraeglich aendern - LoxBerry
# identifiziert das Plugin (zusammen mit NAME/FOLDER aus [PLUGIN]) darueber,
# und Updates wuerden sonst fehlschlagen.
NAME=Ondilo2Loxone Team
EMAIL=info@example.com

[PLUGIN]
# Version des Plugins.
VERSION=0.1.1

# Kurzname / Installationsordner - keine Leerzeichen, klein geschrieben.
# NIEMALS nachtraeglich aendern (siehe Hinweis oben).
NAME=ondilo2loxone
FOLDER=ondilo2loxone

# Anzeigename in der Plugin-Uebersicht (max. 25 Zeichen).
TITLE=Ondilo2Loxone

[AUTOUPDATE]
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/fuul1984/ondilo2loxone/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/fuul1984/ondilo2loxone/main/prerelease.cfg

[SYSTEM]
# Kein Reboot noetig - der Cronjob wird per Symlink in cron.01min aktiv.
REBOOT=false

# Minimal-/Maximalversion von LoxBerry, mit der das Plugin getestet ist.
LB_MINIMUM=3.0.0.0
LB_MAXIMUM=false

# Keine architekturspezifischen Funktionen (kein GPIO o.ae.) verwendet.
ARCHITECTURE=""

# Nutzt LoxBerry::Log - erlaubt dem Anwender, das Loglevel im Plugin-
# Management einzustellen.
CUSTOM_LOGLEVELS=True

# Plugin-Interface-Version.
INTERFACE=2.0
